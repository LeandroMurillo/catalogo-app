services:
  catalogo-frontend:
    build:
      context: ./frontend
    image: catalogo-frontend:v1
    environment:
      API_HOST: ${API_HOST:?API_HOST es obligatoria}
      API_PORT: ${API_PORT:?API_PORT es obligatoria}
    ports:
      - "3000:8080"
    networks:
      - catalogo-net
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      catalogo-api:
        condition: service_healthy
    cap_drop: [ALL]

  catalogo-api:
    build:
      context: ./backend
    image: catalogo-api:v1
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST es obligatoria}
      DB_PORT: ${DB_PORT:?DB_PORT es obligatoria}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatoria}
      DB_USER: ${DB_USER:?DB_USER es obligatoria}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
      MONGO_URI: ${MONGO_URI:-}
      APP_VERSION: ${APP_VERSION:?APP_VERSION es obligatoria}
      ROOT_PATH: ${ROOT_PATH:?ROOT_PATH es obligatoria}
      SEED_DEMO: ${SEED_DEMO:?SEED_DEMO es obligatoria}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - catalogo-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      catalogo-db:
        condition: service_healthy
    cap_drop: [ALL]

  catalogo-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:?DB_USER es obligatoria}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
    volumes:
      - catalogo-db-data:/data/db
    networks:
      - catalogo-net
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

networks:
  catalogo-net:
    name: catalogo-net

volumes:
  catalogo-db-data:
    name: catalogo-db-data
