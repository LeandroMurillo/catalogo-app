apiVersion: v1
kind: Pod
metadata:
  labels:
    run: catalogo-db
  name: catalogo-db
spec:
  containers:
    - env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: catalogo_user
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: REEMPLAZAR_ANTES_DE_APLICAR
      image: mongo:7
      name: catalogo-db
      ports:
        - containerPort: 27017
          protocol: TCP
  restartPolicy: Always
