apiVersion: v1
kind: Pod
metadata:
  labels:
    run: catalogo-frontend
  name: catalogo-frontend
spec:
  containers:
    - name: catalogo-frontend
      image: leandromurillo/catalogo-frontend:v1
      env:
        - name: API_HOST
          value: catalogo-api
        - name: API_PORT
          value: "8000"
      ports:
        - containerPort: 8080
          protocol: TCP
  restartPolicy: Always
