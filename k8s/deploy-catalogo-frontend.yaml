apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo-frontend
  template:
    metadata:
      labels:
        app: catalogo-frontend
    spec:
      containers:
        - name: catalogo-frontend
          image: leandromurillo/catalogo-frontend:v1
          env:
            - name: API_HOST
              value: catalogo-api
            - name: API_PORT
              value: "8000"
          ports:
            - containerPort: 8080
              protocol: TCP
