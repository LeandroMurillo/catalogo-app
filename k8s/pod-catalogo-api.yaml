apiVersion: v1
kind: Pod
metadata:
  labels:
    run: catalogo-api
  name: catalogo-api
spec:
  containers:
    - name: catalogo-api
      image: leandromurillo/catalogo-api:v1
      env:
        - name: DB_HOST
          value: catalogo-db
        - name: DB_PORT
          value: "27017"
        - name: DB_NAME
          value: catalogodb
        - name: DB_USER
          value: catalogo_user
        - name: DB_PASSWORD
          value: REEMPLAZAR_ANTES_DE_APLICAR
        - name: APP_VERSION
          value: v1
        - name: ROOT_PATH
          value: /api
        - name: SEED_DEMO
          value: "true"
      ports:
        - containerPort: 8000
          protocol: TCP
  restartPolicy: Always
